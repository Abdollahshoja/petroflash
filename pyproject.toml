[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petroflash"
version = "0.1.0"
description = "Traceable petroleum-fluid data and phase-equilibrium tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data-build = ["chemicals==1.5.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["petroflash*"]
namespaces = false
